<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chordice</title>
  <!-- An app on the home screen: the manifest names it and its icons, the apple tags do the same for iPhones and iPads. It
       opens without the browser's bars, and its header reaches under the status bar (the header keeps clear of it). -->
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Chordice">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- The colour of the browser's own bars; app.js sets it to the paper of the theme. -->
  <meta name="theme-color" content="#f1ebdf">
  <link rel="stylesheet" href="chordice/styles/main.css">
  <link rel="stylesheet" href="chordice/styles/background.css">
  <link rel="stylesheet" href="chordice/styles/header.css">
  <link rel="stylesheet" href="chordice/styles/options.css">
  <link rel="stylesheet" href="chordice/styles/circle-of-fifths.css">
  <link rel="stylesheet" href="chordice/styles/song.css">
  <link rel="stylesheet" href="chordice/styles/chord.css">
  <link rel="stylesheet" href="chordice/styles/notes.css">
  <link rel="stylesheet" href="chordice/styles/help.css">
  <script type="importmap">
    {
      "imports": {
        "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.3.2/+esm",
        "svguitar": "https://cdn.jsdelivr.net/npm/svguitar@2.11.0/+esm",
        "tonal": "https://cdn.jsdelivr.net/npm/tonal@6.6.0/+esm",
        "vexflow": "https://cdn.jsdelivr.net/npm/vexflow@5.0.0/+esm"
      }
    }
  </script>
  <script type="module" src="chordice/app/main.js"></script>
</head>
<body>
  <!-- The background behind the app: the colour of a painting at once, and the painting (a landscape or an abstract work
       in watercolour) fading in over it once it is painted, anew at random whenever new chords are rolled (see
       app/background/). -->
  <div id="background" class="background" aria-hidden="true"></div>
  <header class="toolbar" data-action="toggle-panel">
    <!-- The buttons left of the title are one group, the buttons right of it another: on a narrow screen each group wraps
         to the next row only as a whole. -->
    <div class="toolbar-start">
      <!-- The panel tabs: the side panel shows the options, the exercises or the help; the pressed one again closes it. -->
      <div class="panel-tabs" role="group" aria-label="Side panel">
        <button type="button" class="options-toggle panel-tab" data-action="toggle-options" aria-controls="options" aria-label="Options" title="Options">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M4 6h16M4 12h11M4 18h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button type="button" class="exercises-toggle panel-tab" data-action="toggle-exercises" aria-controls="options" aria-label="Exercises" title="Exercises">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- A dumbbell: two weights on each side of a bar. -->
            <path d="M8 12h8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <rect x="5" y="6" width="3" height="12" rx="1" fill="currentColor"/>
            <rect x="16" y="6" width="3" height="12" rx="1" fill="currentColor"/>
            <rect x="2" y="9" width="2.5" height="6" rx="1" fill="currentColor"/>
            <rect x="19.5" y="9" width="2.5" height="6" rx="1" fill="currentColor"/>
          </svg>
        </button>
        <button type="button" class="help-toggle panel-tab" data-action="toggle-help" aria-controls="options" aria-label="Help" title="Help">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- A circled i. -->
            <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
            <path d="M12 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <circle cx="12" cy="7.5" r="1.3" fill="currentColor"/>
          </svg>
        </button>
      </div>
      <!-- The instrument tabs: the piano (left) shows the notes of a chord, the guitar (right) its shape. -->
      <div class="instrument-tabs" role="group" aria-label="Instrument">
        <button type="button" class="instrument-tab" data-action="set-instrument" data-instrument="piano" aria-pressed="true" aria-label="Piano: notes" title="Piano: notes">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- Seven white keys in a frame; the separators run down from the top, and the black keys sit on the five boundaries that have one. -->
            <rect x="2" y="5" width="20" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M4.86 5v14M7.71 5v14M10.57 5v14M13.43 5v14M16.29 5v14M19.14 5v14" fill="none" stroke="currentColor" stroke-width="1.2"/>
            <rect x="4.01" y="5" width="1.7" height="8.5" fill="currentColor"/>
            <rect x="6.86" y="5" width="1.7" height="8.5" fill="currentColor"/>
            <rect x="12.58" y="5" width="1.7" height="8.5" fill="currentColor"/>
            <rect x="15.44" y="5" width="1.7" height="8.5" fill="currentColor"/>
            <rect x="18.29" y="5" width="1.7" height="8.5" fill="currentColor"/>
          </svg>
        </button>
        <button type="button" class="instrument-tab" data-action="set-instrument" data-instrument="guitar" aria-pressed="false" aria-label="Guitar: shapes" title="Guitar: shapes">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- An upright guitar: the headstock and the neck on top, the body below. -->
            <rect x="9.8" y="0.8" width="4.4" height="2.6" rx="0.6" fill="currentColor"/>
            <rect x="10.8" y="3" width="2.4" height="9" fill="currentColor"/>
            <path d="M12 11.5c-2.6 0-4.4 1.6-4.4 3.8 0 1.2.6 2 .6 3.1 0 1.3-1.4 2-1.4 3.5 0 2.1 2.2 3.1 5.2 3.1s5.2-1 5.2-3.1c0-1.5-1.4-2.2-1.4-3.5 0-1.1.6-1.9.6-3.1 0-2.2-1.8-3.8-4.4-3.8z" fill="currentColor"/>
          </svg>
        </button>
      </div>
    </div>
    <h1>Chordice</h1>
    <div class="toolbar-end">
      <div class="view-toggles">
        <button type="button" class="roman-toggle" data-action="toggle-roman" aria-label="Roman numerals" aria-pressed="true" data-flag="roman" title="Roman numerals">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <text x="12" y="17" text-anchor="middle" font-size="14" font-weight="600" fill="currentColor">IV</text>
          </svg>
        </button>
        <button type="button" class="tones-toggle" data-action="toggle-tones" aria-label="Chord tones" aria-pressed="false" data-flag="tones" title="Chord tones">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <!-- Three stacked noteheads, tilted like the inversions note, on one quarter-note stem: a chord. -->
            <!-- The noteheads span x 5.3 to 11.1 of the 24 units, the stem's right edge meets their outer edge; the translate centres the chord horizontally. -->
            <g transform="translate(3.8 0)">
              <path d="M10.2 18V1" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <ellipse cx="8.2" cy="6" rx="3" ry="2.3" transform="rotate(-20 8.2 6)" fill="currentColor"/>
              <ellipse cx="8.2" cy="12" rx="3" ry="2.3" transform="rotate(-20 8.2 12)" fill="currentColor"/>
              <ellipse cx="8.2" cy="18" rx="3" ry="2.3" transform="rotate(-20 8.2 18)" fill="currentColor"/>
            </g>
          </svg>
        </button>
        <button type="button" class="colour-toggle" data-action="toggle-colour" aria-label="Colours" aria-pressed="true" data-flag="colour" title="Colours">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <circle cx="13.60" cy="12.00" r="0.90"/>
            <circle cx="13.23" cy="14.74" r="1.10"/>
            <circle cx="9.07" cy="15.28" r="1.30"/>
            <circle cx="6.47" cy="10.24" r="1.50"/>
            <circle cx="11.19" cy="4.85" r="1.70"/>
            <circle cx="19.41" cy="7.63" r="1.90"/>
            <circle cx="20.16" cy="17.78" r="2.10"/>
          </svg>
        </button>
      </div>
      <button type="button" class="painting-toggle" data-action="toggle-painting" aria-label="Painting" aria-pressed="true" data-flag="painting" title="Painting">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <!-- Two mountains, the larger one with snow on its peak. -->
          <path d="M2 20 9 7l4.5 7.5L16 11l6 9z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
          <path d="M7.1 10.3 9 7l1.9 3.3-1 .9-.9-.8-.9.8z" fill="currentColor"/>
        </svg>
      </button>
      <button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Dark mode" aria-pressed="false">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
        </svg>
      </button>
    </div>
  </header>
  <main class="layout">
    <aside id="side-panel" class="side-panel">
      <div id="options" class="options" aria-label="Options">
        <div id="option-list"></div>
      </div>
    </aside>
    <section class="song">
      <p id="status" class="status" role="status" hidden></p>
      <div id="song-rows" class="song-rows" aria-live="polite"></div>
    </section>
  </main>
  <button type="button" class="generate" data-action="reroll">Generate</button>
  <dialog id="notes" class="notes" aria-label="Notes" tabindex="-1">
    <div class="notes-body">
      <ol id="notes-chord" class="chords notes-chord"></ol>
      <div id="notes-staff" class="notes-staff" title="Left half of the window: previous. Right half: next."></div>
      <p id="notes-caption" class="notes-caption" aria-live="polite"></p>
    </div>
  </dialog>
</body>
</html>
