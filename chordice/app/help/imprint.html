<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Imprint</title>
  <link rel="stylesheet" href="../../styles/main.css">
  <link rel="stylesheet" href="../../styles/header.css">
  <link rel="stylesheet" href="../../styles/help.css">
  <script>
    // The page follows the theme chosen in the app, as the help page does (see help.html). Light is the default.
    const cookie = /(?:^|;\s*)chordice_state=([^;]*)/.exec(document.cookie);
    let theme = 'light';
    try {
      const stored = cookie ? decodeURIComponent(cookie[1]) : localStorage.getItem('chordice_state');
      if (stored && JSON.parse(stored).theme === 'dark') {
        theme = 'dark';
      }
    } catch {
      // A broken cookie or copy, or a refused storage, leaves the default theme, as the app does.
    }
    document.documentElement.dataset.theme = theme;
  </script>
</head>
