<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chordice</title>
  <link rel="stylesheet" href="../css/main.css">
  <script type="importmap">
    {
      "imports": {
        "js-yaml": "https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/+esm",
        "tonal": "https://cdn.jsdelivr.net/npm/tonal@6.6.0/+esm",
        "vexflow": "https://cdn.jsdelivr.net/npm/vexflow@5.0.0/+esm"
      }
    }
  </script>
  <script type="module" src="../js/app.js"></script>
</head>
<body>
  <header class="toolbar" data-action="toggle-options">
    <button type="button" class="options-toggle" data-action="toggle-options" aria-controls="options" aria-label="Options" title="Options">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M4 6h16M4 12h11M4 18h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </button>
    <h1>Chordice</h1>
    <div class="view-toggles">
      <button type="button" class="inversions-toggle" data-action="toggle-inversions" aria-label="Inversions" aria-pressed="false" title="Inversions">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <!-- The note spans x 4 to 14 of the 24 units; the translate centres it horizontally. -->
          <g transform="translate(3 0)">
            <ellipse cx="7" cy="17.5" rx="3" ry="2.3" transform="rotate(-20 7 17.5)" fill="currentColor"/>
            <path d="M9.8 17V4c0 0 .4 3.2 4.2 5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </g>
        </svg>
      </button>
      <button type="button" class="details-toggle" data-action="toggle-details" aria-label="Extended information" aria-pressed="true" title="Extended information">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
          <circle cx="12" cy="7.5" r="1.3" fill="currentColor"/>
          <path d="M12 11v6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <button type="button" class="colour-toggle" data-action="toggle-colour" aria-label="Colours" aria-pressed="true" title="Colours">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <circle cx="13.60" cy="12.00" r="0.90"/>
          <circle cx="13.23" cy="14.74" r="1.10"/>
          <circle cx="9.07" cy="15.28" r="1.30"/>
          <circle cx="6.47" cy="10.24" r="1.50"/>
          <circle cx="11.19" cy="4.85" r="1.70"/>
          <circle cx="19.41" cy="7.63" r="1.90"/>
          <circle cx="20.16" cy="17.78" r="2.10"/>
        </svg>
      </button>
    </div>
    <button type="button" class="theme-toggle" data-action="toggle-theme" aria-label="Dark mode" aria-pressed="true">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/>
      </svg>
    </button>
  </header>
  <main class="layout">
    <aside id="side-panel" class="side-panel">
      <div id="options" class="options" aria-label="Options">
        <div id="option-list"></div>
      </div>
    </aside>
    <section class="content">
      <div id="rows" class="rows" aria-live="polite"></div>
    </section>
  </main>
  <button type="button" class="generate" data-action="reroll">Generate</button>
  <dialog id="notes" class="notes" aria-label="Notes">
    <div class="notes-body">
      <div id="notes-staff" class="notes-staff" title="Click for the next inversion"></div>
    </div>
  </dialog>
</body>
</html>
